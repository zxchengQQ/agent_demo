# AI Agent 示例项目主配置
# 业务含义：通用配置，所有环境共享

spring:
  application:
    name: agent-demo
  profiles:
    active: dev  # 默认开发环境
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    connection-timeout: 300000  # SSE 流式接口超时 5 分钟

# 火山引擎方舟 Coding Plan 配置
# 业务含义：使用 Coding Plan 专用地址（/api/coding/v3）按次计费，非标准 /api/v3 按 Token 计费
ark:
  coding-plan:
    base-url: https://ark.cn-beijing.volces.com/api/coding/v3
    api-key: ${ARK_API_KEY}  # 从环境变量注入，禁止硬编码
    default-model: doubao-seed-2.0-code
    models:
      chat: doubao-seed-2.0-pro
      code: doubao-seed-2.0-code
      lite: doubao-seed-2.0-lite
    timeout: 60s
    max-retries: 3
    temperature: 0.7
    vision-model: doubao-vision-pro  # 视觉模型名称，用于 PDF 图片描述生成（CR-002 新增）

# LLM 提供商选择
# 业务含义：通过 provider 切换当前使用的 LLM 提供商，支持 ark（火山引擎方舟）和 bailian（阿里百炼）
# 默认值为 ark，确保不配置时不影响现有功能
llm:
  provider: ark  # ark | bailian（默认 ark，向后兼容）

# 阿里百炼 OpenAI 兼容协议配置
# 业务含义：使用阿里百炼 /compatible-mode/v1 路径，兼容 OpenAI 协议格式
bailian:
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api-key: ${BAILIAN_API_KEY}  # 从环境变量注入，禁止硬编码
  default-model: deepseek-v4-flash
  models:
    chat: deepseek-v4-flash
    code: deepseek-v4-flash
    lite: deepseek-v4-flash
  timeout: 60s
  max-retries: 3
  temperature: 0.7
  embedding-model: text-embedding-v4
  vision-model: qwen3.7-plus  # 视觉模型名称，用于 PDF 图片描述生成（CR-002 新增；与 ark.coding-plan.vision-model 对称，保证 bailian 启动时也能生成图片描述）

# Agent 配置
agent:
  max-iterations: 10
  chat-memory-window-size: 20
  default-system-prompt: "你是一个有用的 AI 助手，可以调用工具帮助用户解决问题。当问题需要计算、查询时间、获取网络信息时，请主动调用相应工具。"
  thinking-system-prompt: "你是一个有用的 AI 助手。请基于你的知识直接回答用户的问题，无需调用任何工具。"
  thinking-max-iterations: 8  # 深度思考 ReAct 模式最大迭代次数
  thinking-react-system-prompt: "你是一个深度思考的 AI Agent，具备工具调用能力。请在回答前按照以下 ReAct 格式输出推理过程：\nThought: 分析用户需求，思考下一步行动\nAction: 描述你打算调用的工具及原因（实际调用由系统处理）\nObservation: （系统填入工具返回结果）\nThought: 基于观察结果继续思考\n...（可多轮 Thought-Action-Observation）\nFinal Answer: 最终回答\n\n重要约束：\n1. 只能使用系统提供的工具（通过 tools 参数传入），不要编造或猜测工具名。\n2. 如果用户的问题超出已有工具的能力范围（如天气查询、股票行情等），不要反复尝试调用不存在的工具，直接基于自身知识回答或告知用户该功能暂不支持。\n3. 当工具返回错误信息时，分析原因后决定下一步，不要盲目重试同一个失败的工具调用。"
  enable-logging: true
  file-allowed-dir: ./data

# 会话配置
session:
  timeout-minutes: 30

# RAG 知识库配置
rag:
  store-type: memory  # 向量存储类型：memory | milvus
  document:
    max-size: 10MB
    supported-formats: txt,md,pdf
    temp-dir: ./data/rag/temp
  chunk:
    size: 1000
    overlap: 200
  retrieval:
    max-results: 5
    min-score: 0.0
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection-name: agent_demo_rag
  # 文档分割配置（按文件类型独立配置 size/overlap/minSize，单位为 Token 数）
  splitter:
    default-config:
      size: 1000
      overlap: 200
      min-size: 500
    md:
      size: 800
      overlap: 150
      min-size: 400
    pdf:
      size: 1200
      overlap: 200
      min-size: 600
      extract-images: true  # 是否提取 PDF 嵌入图片对象（CR-002 新增；BUG 修复后仅提取嵌入图片，不渲染整页）
      image-dpi: 144         # （已废弃）原整页渲染 DPI，BUG 修复后改为提取嵌入图片，配置值不再生效
      max-images-per-page: 15  # 单页图片数量上限（BUG 修复新增），超过则认为是流程图导出碎片化PDF，整页跳过
    txt:
      size: 1000
      overlap: 200
      min-size: 500

# Springdoc Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.agentdemo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
