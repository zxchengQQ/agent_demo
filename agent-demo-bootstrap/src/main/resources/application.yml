# AI Agent 示例项目主配置
# 业务含义：通用配置，所有环境共享

spring:
  application:
    name: agent-demo
  profiles:
    active: dev  # 默认开发环境
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    connection-timeout: 300000  # SSE 流式接口超时 5 分钟

# Agent 配置
agent:
  max-iterations: 10
  chat-memory-window-size: 20
  default-role: general  # 默认角色（对应 prompts/roles/ 目录下的模板文件名）
  # 系统提示词已外部化到 prompts/roles/ 和 prompts/scenarios/ 模板文件
  # AgentConfig 中的默认值作为模板缺失时的最终回退
  thinking-max-iterations: 8  # 深度思考 ReAct 模式最大迭代次数
  enable-logging: true
  file-allowed-dir: ./data
  # 工具产出清洗配置
  # 业务含义：对数据获取类工具（HTTP/文件/MCP/知识库）的产出实施"清洗 + 边界声明 + 字数限制"，
  # 使工具结果作为数据而非指令进入 LLM 上下文，超长内容前缀进入上下文、剩余保存临时文件供模型分段回读。
  tool:
    sanitize:
      enabled: true          # 清洗总开关：false 时所有工具产出直通返回原文（回退开关）
      max-chars: 4000        # 工具产出进入上下文的最大字符数，超过则前缀+临时文件指引
      # 临时文件目录：必须位于 agent.file-allowed-dir（./data）内，否则 Agent 无法通过 readFile 回读剩余内容
      temp-dir: ./data/tool-output
      temp-retention-hours: 24  # 临时文件保留时长（小时），写入时机会式清理超期文件
      # MIME 白名单（HttpTool 响应）：非白名单类型不返回原文，返回可读提示
      allowed-mime-types:
        - text/html
        - application/xhtml+xml
        - text/plain
        - text/markdown
        - application/json
        - application/xml
        - text/xml
        - application/*+json
        - application/*+xml
      # 模式规则组默认在 ToolSanitizeProperties 中定义，可通过以下配置覆盖注入：
      # suspicious-patterns: ["..."]   # 一般可疑（命中保留原文+警示标记）
      # high-risk-patterns: ["..."]    # 高危（命中移除+占位标记）
  # 工具按需加载配置
  tools:
    # 默认加载的工具（Agent 始终可用，无需 API 指定）
    default-tools:
      - builtin:getCurrentTime     # 当前时间查询
      - builtin:getCurrentTimeByZone  # 时区时间查询
      - builtin:getCurrentDate     # 当前日期查询
      - builtin:calculate          # 数学计算器
      - builtin:loadSkill          # 技能加载（渐进式披露核心工具，决策 4/6）
    # 可选工具（需通过 API 显式指定才会加载）
    optional:
      - builtin:httpGet            # HTTP GET 请求
      - builtin:httpPost           # HTTP POST 请求
      - builtin:readFile           # 文件读取
      - mcp:*                      # 所有 MCP 工具
      - rag:*                      # 所有知识库工具

# 会话配置
session:
  timeout-minutes: 30

# RAG 知识库配置
rag:
  store-type: memory  # 向量存储类型：memory | milvus
  document:
    max-size: 10MB
    supported-formats: txt,md,pdf
    temp-dir: ./data/rag/temp
  chunk:
    size: 1000
    overlap: 200
  retrieval:
    max-results: 5
    min-score: 0.0
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection-name: agent_demo_rag
  # 文档分割配置（按文件类型独立配置 size/overlap/minSize，单位为 Token 数）
  splitter:
    default-config:
      size: 1000
      overlap: 200
      min-size: 500
    md:
      size: 800
      overlap: 150
      min-size: 400
    pdf:
      size: 1200
      overlap: 200
      min-size: 600
      extract-images: true  # 是否提取 PDF 嵌入图片对象（CR-002 新增；BUG 修复后仅提取嵌入图片，不渲染整页）
      image-dpi: 144         # （已废弃）原整页渲染 DPI，BUG 修复后改为提取嵌入图片，配置值不再生效
      max-images-per-page: 15  # 单页图片数量上限（BUG 修复新增），超过则认为是流程图导出碎片化PDF，整页跳过
    txt:
      size: 1000
      overlap: 200
      min-size: 500

# MCP 协议模块配置
# 业务含义：MCP 客户端模块，连接外部 MCP Server 并将其工具注册到 ToolRegistry 供 Agent 使用
# 启用开关：mcp.enabled=false 时整个 MCP 模块不加载，所有 MCP API 返回 MCP_MODULE_DISABLED(5405)
mcp:
  enabled: true  # MCP 模块总开关，false 时跳过启动加载并禁用所有 MCP API
  default-tool-timeout: 60s  # 全局默认工具调用超时（可被单 Server 的 tool-timeout 覆盖）
  # 静态预配置 Server 列表（启动时自动加载；动态添加的 Server 仅存内存，重启丢失）
  servers:
    # === mermaid-mcp（远程 Streamable HTTP MCP Server） ===
    # 业务含义：Mermaid 图表生成服务，提供通过自然语言描述生成流程图/时序图等能力
    - name: mermaid-mcp
      transport: http  # Streamable HTTP（新版 MCP 2025-06-18 规范）
      enabled: true
      url: https://mcp.mermaid.ai/mcp
      tool-timeout: 60s

    # === fetch（本地 stdio MCP Server） ===
    # 业务含义：网页抓取服务，通过 npx 启动 mcp-fetch-server 子进程，提供 URL 内容获取能力
    - name: fetch
      transport: stdio
      enabled: true
      command: npx.cmd  # Windows 需 .cmd 后缀，Linux/Mac 用 npx
      args:
        - mcp-fetch-server
      tool-timeout: 60s

    # === web-search（本地 stdio MCP Server） ===
    # 业务含义：网页搜索服务，通过 npx 启动 open-websearch 子进程，提供多搜索引擎检索能力
    - name: web-search
      transport: stdio
      enabled: true
      command: npx.cmd  # Windows 需 .cmd 后缀，Linux/Mac 用 npx
      args:
        - open-websearch@latest
      env:
        MODE: stdio                   # 运行模式：stdio 子进程通信
        DEFAULT_SEARCH_ENGINE: duckduckgo  # 默认搜索引擎
        ALLOWED_SEARCH_ENGINES: duckduckgo,bing,exa  # 允许使用的搜索引擎列表
      tool-timeout: 60s

    # === stdio 传输示例（本地子进程） ===
    # - name: weather  # 唯一标识（与知识库"名称全局唯一"风格一致）
    #   transport: stdio  # stdio | sse
    #   enabled: true  # 是否启用（false 时跳过该 Server）
    #   command: node  # 启动 MCP Server 的命令
    #   args:
    #     - /path/to/weather-server.js
    #   env:
    #     API_KEY: xxx
    #   tool-timeout: 60s  # 单 Server 超时（覆盖 default-tool-timeout）
    # === HTTP+SSE 传输示例（远程） ===
    # - name: remote-fetch
    #   transport: sse
    #   enabled: true
    #   url: https://mcp.example.com/sse  # MCP Server SSE 端点
    #   headers:
    #     Authorization: Bearer xxx
    #   tool-timeout: 60s

# Skill 能力域配置
# 业务含义：平台第 10 能力域，技能定义/激活/提示词组装
# 启用开关：skill.enabled=false 时全链路零影响退化（目录/激活段空串、loadSkill 不注册）
skill:
  enabled: true  # 技能能力总开关
  max-active-skills: 3  # 单会话并发激活技能上限（AC-S05）
  storage-dir: data/skills  # 技能定义持久化目录

# LangSmith 可观测性配置（langsmith-observability，2026-08-29）
# 业务含义：Agent 执行链路（LLM+工具调用）经 OpenTelemetry OTLP 上报 LangSmith 云。
# 三重护栏：默认关闭（enabled=false 或未配 Key 时零初始化零外联，AC-S02）+
# 基础脱敏（上报前密钥模式/环境密钥值替换，AC-S01）+ 静默降级（上报失败仅 WARN 不影响主流程，AC-S04）。
langsmith:
  enabled: false  # 总开关：false 时整个可观测子系统不装配（NoopTraceCollector，零开销）
  api-key: ${LANGSMITH_API_KEY:}  # LangSmith API Key，仅经环境变量注入（禁止硬编码，AC-S03）
  endpoint: https://api.smith.langchain.com/otel/v1/traces  # OTLP trace 完整端点（OTel Java exporter 直接使用此 URL，缺 /v1/traces 会导致 404；也可只配 base .../otel 由代码补全）
  project: agent-demo  # LangSmith 项目名：作为 service.name 资源属性 + Langsmith-Project header 归属项目（未设置时落 unknown_service:java 导致找不到记录）
  max-field-chars: 4000  # 单字段上报上限（字符），超过截断并标记 [TRUNCATED]（AC-E02）
  export-timeout-ms: 5000  # OTLP 导出请求超时（毫秒）
  export-interval-ms: 5000  # 批量导出间隔（毫秒）
  max-queue-size: 2048  # 导出内存队列上限（防内存膨胀）
  # proxy-host: ""  # 可选 HTTP 代理主机（直连场景留空）
  # proxy-port: 0    # 可选 HTTP 代理端口

# Springdoc Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.agentdemo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
