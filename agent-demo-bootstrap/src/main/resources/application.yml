# AI Agent 示例项目主配置
# 业务含义：通用配置，所有环境共享

spring:
  application:
    name: agent-demo
  profiles:
    active: dev  # 默认开发环境
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    connection-timeout: 300000  # SSE 流式接口超时 5 分钟

# 火山引擎方舟 Coding Plan 配置
# 业务含义：使用 Coding Plan 专用地址（/api/coding/v3）按次计费，非标准 /api/v3 按 Token 计费
ark:
  coding-plan:
    base-url: https://ark.cn-beijing.volces.com/api/coding/v3
    api-key: ${ARK_API_KEY}  # 从环境变量注入，禁止硬编码
    default-model: doubao-seed-2.0-code
    models:
      chat: doubao-seed-2.0-pro
      code: doubao-seed-2.0-code
      lite: doubao-seed-2.0-lite
    timeout: 60s
    max-retries: 3
    temperature: 0.7
    vision-model: doubao-vision-pro  # 视觉模型名称，用于 PDF 图片描述生成（CR-002 新增）

# LLM 提供商选择
# 业务含义：通过 provider 切换当前使用的 LLM 提供商，支持 ark（火山引擎方舟）和 bailian（阿里百炼）
# 默认值为 ark，确保不配置时不影响现有功能
llm:
  provider: bailian  # ark | bailian（默认 ark，向后兼容）

# 阿里百炼 OpenAI 兼容协议配置
# 业务含义：使用阿里百炼 /compatible-mode/v1 路径，兼容 OpenAI 协议格式
bailian:
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api-key: ${BAILIAN_API_KEY}  # 从环境变量注入，禁止硬编码
  default-model: glm-5.2
  models:
    chat: deepseek-v4-flash
    code: deepseek-v4-flash
    lite: deepseek-v4-flash
  timeout: 60s
  max-retries: 3
  temperature: 0.7
  embedding-model: text-embedding-v4
  vision-model: qwen3.7-plus  # 视觉模型名称，用于 PDF 图片描述生成（CR-002 新增；与 ark.coding-plan.vision-model 对称，保证 bailian 启动时也能生成图片描述）

# Agent 配置
agent:
  max-iterations: 10
  chat-memory-window-size: 20
  default-role: general  # 默认角色（对应 prompts/roles/ 目录下的模板文件名）
  # 系统提示词已外部化到 prompts/roles/ 和 prompts/scenarios/ 模板文件
  # AgentConfig 中的默认值作为模板缺失时的最终回退
  thinking-max-iterations: 8  # 深度思考 ReAct 模式最大迭代次数
  enable-logging: true
  file-allowed-dir: ./data

# 会话配置
session:
  timeout-minutes: 30

# RAG 知识库配置
rag:
  store-type: memory  # 向量存储类型：memory | milvus
  document:
    max-size: 10MB
    supported-formats: txt,md,pdf
    temp-dir: ./data/rag/temp
  chunk:
    size: 1000
    overlap: 200
  retrieval:
    max-results: 5
    min-score: 0.0
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection-name: agent_demo_rag
  # 文档分割配置（按文件类型独立配置 size/overlap/minSize，单位为 Token 数）
  splitter:
    default-config:
      size: 1000
      overlap: 200
      min-size: 500
    md:
      size: 800
      overlap: 150
      min-size: 400
    pdf:
      size: 1200
      overlap: 200
      min-size: 600
      extract-images: true  # 是否提取 PDF 嵌入图片对象（CR-002 新增；BUG 修复后仅提取嵌入图片，不渲染整页）
      image-dpi: 144         # （已废弃）原整页渲染 DPI，BUG 修复后改为提取嵌入图片，配置值不再生效
      max-images-per-page: 15  # 单页图片数量上限（BUG 修复新增），超过则认为是流程图导出碎片化PDF，整页跳过
    txt:
      size: 1000
      overlap: 200
      min-size: 500

# MCP 协议模块配置
# 业务含义：MCP 客户端模块，连接外部 MCP Server 并将其工具注册到 ToolRegistry 供 Agent 使用
# 启用开关：mcp.enabled=false 时整个 MCP 模块不加载，所有 MCP API 返回 MCP_MODULE_DISABLED(5405)
mcp:
  enabled: true  # MCP 模块总开关，false 时跳过启动加载并禁用所有 MCP API
  default-tool-timeout: 60s  # 全局默认工具调用超时（可被单 Server 的 tool-timeout 覆盖）
  # 静态预配置 Server 列表（启动时自动加载；动态添加的 Server 仅存内存，重启丢失）
  servers:
    # === mermaid-mcp（远程 Streamable HTTP MCP Server） ===
    # 业务含义：Mermaid 图表生成服务，提供通过自然语言描述生成流程图/时序图等能力
    - name: mermaid-mcp
      transport: http  # Streamable HTTP（新版 MCP 2025-06-18 规范）
      enabled: true
      url: https://mcp.mermaid.ai/mcp
      tool-timeout: 60s

    # === fetch（本地 stdio MCP Server） ===
    # 业务含义：网页抓取服务，通过 npx 启动 mcp-fetch-server 子进程，提供 URL 内容获取能力
    - name: fetch
      transport: stdio
      enabled: true
      command: npx.cmd  # Windows 需 .cmd 后缀，Linux/Mac 用 npx
      args:
        - mcp-fetch-server
      tool-timeout: 60s

    # === stdio 传输示例（本地子进程） ===
    # - name: weather  # 唯一标识（与知识库"名称全局唯一"风格一致）
    #   transport: stdio  # stdio | sse
    #   enabled: true  # 是否启用（false 时跳过该 Server）
    #   command: node  # 启动 MCP Server 的命令
    #   args:
    #     - /path/to/weather-server.js
    #   env:
    #     API_KEY: xxx
    #   tool-timeout: 60s  # 单 Server 超时（覆盖 default-tool-timeout）
    # === HTTP+SSE 传输示例（远程） ===
    # - name: remote-fetch
    #   transport: sse
    #   enabled: true
    #   url: https://mcp.example.com/sse  # MCP Server SSE 端点
    #   headers:
    #     Authorization: Bearer xxx
    #   tool-timeout: 60s

# Springdoc Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.agentdemo: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
